[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midiplay"
version = "0.1.0"
description = "Real-time MIDI to MuseScore Clipboard Bridge"
readme = "README.md"
authors = [{ name = "midiplay contributors" }]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "python-rtmidi>=1.5.8",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
]

[project.scripts]
midiplay = "midiplay.main:main"
